<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="ZeroHour architecture: days before results day every result is encrypted by a Step Functions Distributed Map and written to an Object-Locked S3 bucket; a durable Lambda sleeps until release time, two of three officials approve through API Gateway, and only a 32-byte key is published for phones to decrypt locally.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3c4559"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1f6feb"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#f7f8fb"/>
  <text x="40" y="38" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b1324">ZeroHour — deliver results early, release only a key</text>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#0b1324">
    <!-- row labels -->
    <text x="40" y="70" font-size="11" font-weight="700" fill="#5b6478" letter-spacing="1">1 · STAGE — DAYS BEFORE RESULTS DAY</text>
    <text x="40" y="292" font-size="11" font-weight="700" fill="#5b6478" letter-spacing="1">2 · RELEASE — ZERO HOUR</text>
    <text x="40" y="462" font-size="11" font-weight="700" fill="#5b6478" letter-spacing="1">3 · PEOPLE</text>

    <!-- Row 1 -->
    <rect x="40" y="80" width="180" height="90" rx="10" fill="#fff" stroke="#c8cfdd"/>
    <text x="130" y="112" font-size="14" font-weight="700" text-anchor="middle">Amazon S3 (raw)</text>
    <text x="130" y="132" font-size="12" text-anchor="middle" fill="#3c4559">results CSV</text>
    <text x="130" y="150" font-size="12" text-anchor="middle" fill="#3c4559">private · KMS-encrypted</text>

    <rect x="300" y="80" width="220" height="90" rx="10" fill="#fff" stroke="#c8cfdd"/>
    <text x="410" y="112" font-size="14" font-weight="700" text-anchor="middle">AWS Step Functions</text>
    <text x="410" y="132" font-size="12" text-anchor="middle" fill="#3c4559">publish · Distributed Map</text>
    <text x="410" y="150" font-size="12" text-anchor="middle" fill="#3c4559">143 children × 350 rows</text>

    <rect x="580" y="80" width="180" height="90" rx="10" fill="#fff" stroke="#c8cfdd"/>
    <text x="670" y="112" font-size="14" font-weight="700" text-anchor="middle">AWS Lambda</text>
    <text x="670" y="132" font-size="12" text-anchor="middle" fill="#3c4559">encryptBatch</text>
    <text x="670" y="150" font-size="12" text-anchor="middle" fill="#3c4559">HKDF + AES-256-GCM</text>

    <!-- KMS / DynamoDB -->
    <rect x="580" y="200" width="180" height="56" rx="10" fill="#fff" stroke="#c8cfdd" stroke-dasharray="4 3"/>
    <text x="670" y="224" font-size="13" font-weight="700" text-anchor="middle">AWS KMS + DynamoDB</text>
    <text x="670" y="243" font-size="12" text-anchor="middle" fill="#3c4559">wrapped master key</text>

    <!-- S3 public -->
    <rect x="880" y="80" width="280" height="310" rx="12" fill="#fff" stroke="#3c4559" stroke-width="1.5"/>
    <text x="1020" y="108" font-size="14" font-weight="700" text-anchor="middle">Amazon S3 (public)</text>
    <text x="1020" y="126" font-size="12" text-anchor="middle" fill="#3c4559">Object Lock · HTTPS only</text>
    <rect x="900" y="140" width="240" height="44" rx="8" fill="#eef1f7"/>
    <text x="1020" y="160" font-size="12" font-weight="700" text-anchor="middle">r/&lt;batch&gt;/&lt;sha256(USN)&gt;.bin × 50,000</text>
    <text x="1020" y="176" font-size="11" text-anchor="middle" fill="#3c4559">1,069 bytes each · unreadable</text>
    <rect x="900" y="194" width="240" height="44" rx="8" fill="#eef1f7"/>
    <text x="1020" y="214" font-size="12" font-weight="700" text-anchor="middle">manifest.json</text>
    <text x="1020" y="230" font-size="11" text-anchor="middle" fill="#3c4559">SHA-256 of every file + root hash</text>
    <text x="1020" y="276" font-size="11" text-anchor="middle" fill="#5b6478">served to phones via CloudFront edge (design)</text>
    <text x="1020" y="292" font-size="11" text-anchor="middle" fill="#5b6478">or S3 over HTTPS (current demo)</text>
    <rect x="900" y="324" width="240" height="50" rx="8" fill="#e6efff" stroke="#1f6feb"/>
    <text x="1020" y="345" font-size="12" font-weight="700" text-anchor="middle" fill="#0b3a8c">release.json</text>
    <text x="1020" y="362" font-size="11" text-anchor="middle" fill="#0b3a8c">locked → { key: 32 bytes }</text>

    <!-- Row 2 -->
    <rect x="40" y="300" width="180" height="90" rx="10" fill="#fff" stroke="#c8cfdd"/>
    <text x="130" y="332" font-size="14" font-weight="700" text-anchor="middle">Lambda durable fn</text>
    <text x="130" y="352" font-size="12" text-anchor="middle" fill="#3c4559">releaseWaiter</text>
    <text x="130" y="370" font-size="12" text-anchor="middle" fill="#3c4559">sleeps · no compute billed</text>

    <rect x="300" y="300" width="220" height="90" rx="10" fill="#fff" stroke="#c8cfdd"/>
    <text x="410" y="332" font-size="14" font-weight="700" text-anchor="middle">AWS Step Functions</text>
    <text x="410" y="352" font-size="12" text-anchor="middle" fill="#3c4559">approval · waitForTaskToken</text>
    <text x="410" y="370" font-size="12" text-anchor="middle" fill="#3c4559">paused up to 7 days</text>

    <rect x="580" y="300" width="180" height="90" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="670" y="332" font-size="14" font-weight="700" text-anchor="middle">AWS Lambda</text>
    <text x="670" y="352" font-size="12" text-anchor="middle" fill="#3c4559">publishKey</text>
    <text x="670" y="370" font-size="12" text-anchor="middle" fill="#3c4559">only after 2 of 3</text>

    <!-- Row 3 -->
    <rect x="40" y="470" width="180" height="90" rx="10" fill="#fff" stroke="#c8cfdd"/>
    <text x="130" y="502" font-size="14" font-weight="700" text-anchor="middle">3 officials</text>
    <text x="130" y="522" font-size="12" text-anchor="middle" fill="#3c4559">one-time links</text>
    <text x="130" y="540" font-size="12" text-anchor="middle" fill="#3c4559">on their phones</text>

    <rect x="300" y="470" width="220" height="90" rx="10" fill="#fff" stroke="#c8cfdd"/>
    <text x="410" y="502" font-size="14" font-weight="700" text-anchor="middle">API Gateway + Lambda</text>
    <text x="410" y="522" font-size="12" text-anchor="middle" fill="#3c4559">approve · DynamoDB</text>
    <text x="410" y="540" font-size="12" text-anchor="middle" fill="#3c4559">conditional writes</text>

    <rect x="880" y="470" width="280" height="90" rx="12" fill="#fff" stroke="#3c4559" stroke-width="1.5"/>
    <text x="1020" y="502" font-size="14" font-weight="700" text-anchor="middle">Student phone (PWA)</text>
    <text x="1020" y="522" font-size="12" text-anchor="middle" fill="#3c4559">file kept in IndexedDB</text>
    <text x="1020" y="540" font-size="12" text-anchor="middle" fill="#3c4559">WebCrypto decrypt with USN + DOB</text>
  </g>

  <!-- arrows -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#3c4559" stroke-linecap="round">
    <line x1="220" y1="125" x2="296" y2="125" stroke="#3c4559" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="258" y="117" text-anchor="middle">reads CSV</text>

    <line x1="520" y1="125" x2="576" y2="125" stroke="#3c4559" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="548" y="117" text-anchor="middle">batches</text>

    <line x1="760" y1="162" x2="896" y2="162" stroke="#3c4559" stroke-width="3" marker-end="url(#a)"/>
    <text x="828" y="154" text-anchor="middle">writes, locked</text>

    <line x1="670" y1="200" x2="670" y2="174" stroke="#3c4559" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <line x1="670" y1="256" x2="670" y2="296" stroke="#3c4559" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a)"/>
    <text x="680" y="282">unwrap key</text>
    <text x="680" y="192">unwrap key</text>

    <polyline points="360,170 360,268 254,268 254,320 224,320" fill="none" stroke="#3c4559" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="368" y="222">on publish:</text>
    <text x="368" y="236">start waiter (async)</text>

    <line x1="220" y1="345" x2="296" y2="345" stroke="#3c4559" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="258" y="337" text-anchor="middle">at releaseAt</text>

    <line x1="520" y1="345" x2="576" y2="345" stroke="#3c4559" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="548" y="337" text-anchor="middle">resumes</text>

    <line x1="220" y1="515" x2="296" y2="515" stroke="#3c4559" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="258" y="507" text-anchor="middle">tap Approve</text>

    <line x1="410" y1="470" x2="410" y2="394" stroke="#3c4559" stroke-width="1.5" marker-end="url(#a)"/>
    <text x="418" y="436">2nd approval:</text>
    <text x="418" y="450">SendTaskSuccess</text>

    <line x1="760" y1="349" x2="896" y2="349" stroke="#1f6feb" stroke-width="2" marker-end="url(#k)"/>
    <text x="828" y="341" text-anchor="middle" fill="#1f6feb" font-weight="700">publishes key</text>

    <!-- delivery to phones -->
    <line x1="940" y1="390" x2="940" y2="466" stroke="#3c4559" stroke-width="3" marker-end="url(#a)"/>
    <text x="932" y="420" text-anchor="end">① days early:</text>
    <text x="932" y="434" text-anchor="end">own 1,069-byte file</text>
    <line x1="1100" y1="390" x2="1100" y2="466" stroke="#1f6feb" stroke-width="2" marker-end="url(#k)"/>
    <text x="1108" y="420" fill="#1f6feb" font-weight="700">② zero hour:</text>
    <text x="1108" y="434" fill="#1f6feb" font-weight="700">32-byte key</text>
  </g>

  <text x="40" y="612" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6478">Heavy arrows: bulk data, moved days early. Blue: the only thing that moves at zero hour, the key. Region ap-south-1 (Mumbai). Fully serverless.</text>
</svg>
